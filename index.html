<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.name }}의 한 페이지 소개</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 680px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 6px; }
        .title { font-size: 1.1rem; color: var(--text-sub); margin-bottom: 24px; }
        
        .section-title {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .section { margin-bottom: 28px; }
        .section:last-child { margin-bottom: 0; }

        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { 
            background-color: #0f172a; 
            color: var(--text-main); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 0.95rem; 
            border: 1px solid var(--border); 
        }

        .insta-link {
            display: inline-block;
            margin-top: 6px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
        }
        .insta-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>{{ data.name }}</h1>
        <div class="title">{{ data.title }}</div>

        <div class="section">
            <div class="section-title">👋 짧은 자기소개</div>
            <p style="color: var(--text-sub); line-height: 1.6; font-size: 1.05rem;">{{ data.intro }}</p>
        </div>

        <div class="section">
            <div class="section-title">🚀 배우고 싶은 것들</div>
            <div class="tags">
                {% for item in data.learning %}
                    <span class="tag">{{ item }}</span>
                {% endfor %}
            </div>
        </div>

        <div class="section">
            <div class="section-title">📱 연락 및 채널</div>
            <p style="color: var(--text-sub);">
                인스타그램: 
                <a href="https://instagram.com/ebrio_jis_" target="_blank" class="insta-link">{{ data.instagram }}</a>
            </p>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 8px;">(연락처 및 주소는 비공개)</p>
        </div>
    </div>
</div>

</body>
</html>
